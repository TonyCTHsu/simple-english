name: simple-english
description: Lint Markdown prose and code comments with simple_english
inputs:
  files:
    description: Newline-separated files or directories to lint
    required: false
    default: .
  format:
    description: Finding output format, text, json, or sarif
    required: false
    default: text
  version:
    description: Gem version to install. Defaults to this action's ref (v1.2.3 -> 1.2.3), latest when SHA-pinned.
    required: false
outputs:
  sarif:
    description: Path to the SARIF report, written when format is sarif
    value: simple-english.sarif
runs:
  using: composite
  steps:
    - name: Install the gem
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
      run: |
        VERSION="${{ inputs.version }}"
        if [ -z "$VERSION" ]; then
          VERSION="${ACTION_REF#v}"
          # A SHA pin names no gem version.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || VERSION=""
        fi
        if [ -n "$VERSION" ]; then
          gem install simple_english --no-document --version "$VERSION"
        else
          gem install simple_english --no-document
        fi
    - name: Lint
      id: lint
      shell: bash
      env:
        FILES: ${{ inputs.files }}
        FORMAT: ${{ inputs.format }}
      run: |
        if [ "$FORMAT" = sarif ]; then
          exec 1>simple-english.sarif
        fi
        se lint --format "$FORMAT" $FILES
