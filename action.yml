name: simple-english
description: Lint Markdown prose and code comments with simple_english
inputs:
  files:
    description: Files or directories to lint
    required: false
    default: .
  version:
    description: Gem version to install. Defaults to this action's ref (v1.2.3 -> 1.2.3), latest when SHA-pinned.
    required: false
runs:
  using: composite
  steps:
    - name: Install the gem
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        if [ -z "$VERSION" ]; then
          REF="${{ github.action_ref }}"
          VERSION="${REF#v}"
          # A SHA pin names no gem version.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || VERSION=latest
        fi
        gem install simple_english --no-document --version "$VERSION"
    - name: Lint
      shell: bash
      run: se lint "${{ inputs.files }}"
