kind: Changed
body: The gem now includes its lint engine on supported platforms. The se setup command is a no-op that prints a notice. Java downloads, SE_JAVA, and SE_CACHE_DIR are no longer supported. Builds target macOS 12 or newer on arm64, and Linux x86-64 or Linux arm64 with glibc 2.35 or newer.
