kind: Fixed
body: 'Fix SE_NO_CONTRACTIONS to catch the apostrophe-initial forms you''re, we''ve, she''ll, he''d, and I''m. LanguageTool splits them off the word, and the old regex missed the leftover token. The apostrophe-s form stays out. It is both "it is" and the possessive, and the tagger does not tell them apart reliably.'
