name: Release

on:
  workflow_dispatch:

# Mirrors the CI env: when the toolchain changes, both workflows must
# change together, or release and CI compile with different compilers.
env:
  GRAALVM_DISTRIBUTION: graalvm-community
  GRAALVM_VERSION: "25.0.2"

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"

      - name: Read the gem version
        id: version
        run: echo "version=$(ruby -Ilib -rsimple_english -e 'print SimpleEnglish::VERSION')" >> "$GITHUB_OUTPUT"

      - uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        id: changelog
        with:
          path: ./CHANGELOG.md
          version: ${{ steps.version.outputs.version }}
          validation_level: error
          validation_depth: 100

      - name: Create the GitHub release and the tag
        run: |
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes-file "${{ steps.changelog.outputs.changes_file }}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}

  gem:
    needs: release
    strategy:
      # A failed platform must not cancel the others: each leg publishes
      # independently, and re-running the failed jobs publishes only the
      # platforms still missing from RubyGems.
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          distribution: ${{ env.GRAALVM_DISTRIBUTION }}
          version: ${{ env.GRAALVM_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # No bundle or Maven caches here: release builds fetch every input
      # fresh, so the provenance records a complete build, not a cache hit.
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"

      - name: Install the bundle
        run: bundle install

      - name: Build, verify, and package the native server and gem
        run: bundle exec rake build
        env:
          NATIVE_IMAGE_PARALLELISM: "4"

      - name: Check the binary floors
        run: .github/scripts/check-floors.sh

      - name: Verify platform gem
        run: |
          gem install --no-document "dist/simple_english-${VERSION}-*.gem"
          bin/e2e-story
        env:
          VERSION: ${{ needs.release.outputs.version }}

      - name: Attest the platform gem
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/dist/simple_english-*.gem

      # RubyGems rejects re-pushing a published version. A re-run
      # rebuilds, and the rebuilt gem differs from the published bytes.
      # This step gates the upload and the push below. A re-run leaves a
      # published platform alone.
      - name: Check whether the platform gem is published
        id: published
        run: |
          gem_files=(dist/simple_english-"${VERSION}"-*.gem)
          gem_file="${gem_files[0]}"
          platform="$(basename "${gem_file}")"
          platform="${platform#simple_english-"${VERSION}"-}"
          platform="${platform%.gem}"
          if curl -fsIL "https://rubygems.org/gems/simple_english-${VERSION}-${platform}.gem" >/dev/null 2>&1; then
            echo "${platform} already published, skipping the upload and the push"
            echo "published=yes" >> "$GITHUB_OUTPUT"
          else
            echo "published=no" >> "$GITHUB_OUTPUT"
          fi
          echo "gem_file=${gem_file}" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ needs.release.outputs.version }}

      # A copy of the published gem, as a convenience download. RubyGems
      # stays the canonical source. The upload runs before the push, so a
      # published gem always has its copy here.
      - name: Upload the gem to the release
        if: steps.published.outputs.published == 'no'
        run: gh release upload "v${VERSION}" dist/simple_english-*.gem --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}

      # The Sigstore certificate names the job that signs, so the gem must
      # be signed in the same job that built it. This is that job.
      - name: Check out the RubyGems attestation patch
        if: steps.published.outputs.published == 'no'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rubygems/release-gem
          ref: v1.4.1
          path: .tmp/release-gem
          persist-credentials: false

      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
        if: steps.published.outputs.published == 'no'

      - name: Publish the platform gem
        if: steps.published.outputs.published == 'no'
        run: |
          gem push "$GEM_FILE"
          gem exec rubygems-await "$GEM_FILE"
        env:
          GEM_FILE: ${{ steps.published.outputs.gem_file }}
          RUBYOPT: "-r${{ github.workspace }}/.tmp/release-gem/rubygems-attestation-patch.rb"
          VERSION: ${{ needs.release.outputs.version }}

      # A published platform skips the push. This wait still guards the
      # image job below against RubyGems propagation lag.
      - name: Await the published gem
        if: steps.published.outputs.published == 'yes'
        run: gem exec rubygems-await "$GEM_FILE"
        env:
          GEM_FILE: ${{ steps.published.outputs.gem_file }}

  image:
    needs: [release, gem]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/tonycthsu/simple-english:latest,ghcr.io/tonycthsu/simple-english:v${{ needs.release.outputs.version }}

      # The image is a one-shot CLI. This proves the gem installed, the
      # engine boots, and a lint exits clean on this README.
      - name: Smoke-test the image
        run: |
          docker run --rm -v "$PWD":/work:ro \
            "ghcr.io/tonycthsu/simple-english:v${VERSION}" README.md
          test "$(docker run --rm "ghcr.io/tonycthsu/simple-english:v${VERSION}" version)" = "${VERSION}"
        env:
          VERSION: ${{ needs.release.outputs.version }}

  tap:
    needs: gem
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Fires the bump workflow on TonyCTHsu/homebrew-tap, which
      # opens a draft PR there. toby-sidekick must stay installed on
      # the tap with Contents: write.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: toby
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: TonyCTHsu
          repositories: homebrew-tap
      - run: gh api repos/TonyCTHsu/homebrew-tap/dispatches -f event_type=gem-released
        env:
          GH_TOKEN: ${{ steps.toby.outputs.token }}
