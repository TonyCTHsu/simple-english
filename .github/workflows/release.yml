name: Release

on:
  workflow_dispatch:

# Mirrors the CI env: when the toolchain changes, both workflows must
# change together, or release and CI compile with different compilers.
env:
  GRAALVM_DISTRIBUTION: graalvm-community
  GRAALVM_VERSION: "25.0.2"

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"

      - name: Read the gem version
        id: version
        run: echo "version=$(ruby -Ilib -rsimple_english -e 'print SimpleEnglish::VERSION')" >> "$GITHUB_OUTPUT"

      - uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        id: changelog
        with:
          path: ./CHANGELOG.md
          version: ${{ steps.version.outputs.version }}
          validation_level: error
          validation_depth: 100

      - name: Create the GitHub release and the tag
        run: |
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes-file "${{ steps.changelog.outputs.changes_file }}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}

  gem:
    needs: release
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          distribution: ${{ env.GRAALVM_DISTRIBUTION }}
          version: ${{ env.GRAALVM_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build, verify, and package the native server and gem
        run: bundle exec rake build
        env:
          NATIVE_IMAGE_PARALLELISM: "4"

      - name: Check the glibc floor
        if: runner.os == 'Linux'
        run: |
          floor=GLIBC_2.35
          binary=libexec/simple_english/languagetool-server
          highest=$(objdump -T "$binary" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          [ "$(printf '%s\n' "$floor" "$highest" | sort -V | tail -1)" = "$floor" ] ||
            { echo "error: binary requires $highest, above the $floor floor"; exit 1; }
          echo "glibc floor ok: $highest"

      - name: Check the macOS floor
        if: runner.os == 'macOS'
        run: |
          floor=12.0
          binary=libexec/simple_english/languagetool-server
          minos=$(otool -l "$binary" | grep -A4 LC_BUILD_VERSION | grep minos | awk '{print $NF}')
          [ -n "$minos" ] || { echo "error: no LC_BUILD_VERSION minos in $binary"; exit 1; }
          [ "$(printf '%s\n' "$floor" "$minos" | sort -V | tail -1)" = "$floor" ] ||
            { echo "error: binary requires macOS $minos, above the $floor floor"; exit 1; }
          echo "macOS floor ok: $minos"

      - name: Verify platform gem
        run: |
          gem install --no-document "dist/simple_english-${VERSION}-*.gem"
          bin/e2e-story
        env:
          VERSION: ${{ needs.release.outputs.version }}

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/dist/*

      - name: Upload release artifacts
        run: gh release upload "v${VERSION}" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}

      - name: Check out the RubyGems attestation patch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rubygems/release-gem
          ref: v1.4.1
          path: .tmp/release-gem
          persist-credentials: false

      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish platform gem
        run: gem push "dist/simple_english-${VERSION}-*.gem"
        env:
          RUBYOPT: "-r${{ github.workspace }}/.tmp/release-gem/rubygems-attestation-patch.rb"
          VERSION: ${{ needs.release.outputs.version }}

  image:
    needs: [release, gem]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/tonycthsu/simple-english:latest,ghcr.io/tonycthsu/simple-english:v${{ needs.release.outputs.version }}

  tap:
    needs: gem
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Fires the bump workflow on TonyCTHsu/homebrew-tap, which
      # opens a draft PR there. toby-sidekick must stay installed on
      # the tap with Contents: write.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: toby
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: TonyCTHsu
          repositories: homebrew-tap
      - run: gh api repos/TonyCTHsu/homebrew-tap/dispatches -f event_type=gem-released
        env:
          GH_TOKEN: ${{ steps.toby.outputs.token }}
