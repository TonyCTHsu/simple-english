name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run the unit tests
        run: bundle exec rake test

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.standard-gems
          key: standardrb-1.56.0

      - name: StandardRB
        run: |
          if [ ! -x "$HOME/.standard-gems/bin/standardrb" ]; then
            gem install standard --no-document -v 1.56.0 --install-dir "$HOME/.standard-gems"
          fi
          PATH="$HOME/.standard-gems/bin:$PATH" GEM_PATH="$HOME/.standard-gems" standardrb

      - name: Actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7
          ./actionlint

      - name: Hadolint
        run: |
          curl -sSfL -o hadolint https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64
          chmod +x hadolint
          ./hadolint Dockerfile

      - name: Install changie
        uses: ./.github/actions/install-changie

      - name: Validate changie fragments
        shell: bash
        # changie next auto reads every fragment and fails on invalid YAML,
        # but errors when no fragments exist, so skip the empty state
        run: |
          shopt -s nullglob
          fragments=(.changes/unreleased/*.yaml)
          [ ${#fragments[@]} -eq 0 ] || changie next auto

      - name: Changelog
        uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        with:
          path: ./CHANGELOG.md
          validation_level: error
          validation_depth: 100

  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.12
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Check native reachability metadata
        run: ruby native/languagetool/metadata.rb --check

      - name: Build native LanguageTool server
        run: ruby native/languagetool/build.rb
        env:
          NATIVE_IMAGE_PARALLELISM: "4"

      - name: Verify native LanguageTool parity
        run: |
          ruby native/languagetool/verify.rb \
            "$(cat tmp/native-languagetool/classpath)" \
            tmp/native-languagetool/languagetool-native

      - name: Run the rules checks
        run: bundle exec rake check
        env:
          SE_LANGUAGETOOL_EXECUTABLE: ${{ github.workspace }}/tmp/native-languagetool/languagetool-native
