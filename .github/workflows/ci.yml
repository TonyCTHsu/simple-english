name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run the unit tests
        run: bundle exec rake test

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.standard-gems
          key: standardrb-1.56.0

      - name: StandardRB
        run: |
          if [ ! -x "$HOME/.standard-gems/bin/standardrb" ]; then
            gem install standard --no-document -v 1.56.0 --install-dir "$HOME/.standard-gems"
          fi
          PATH="$HOME/.standard-gems/bin:$PATH" GEM_PATH="$HOME/.standard-gems" standardrb

      - name: Actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7
          ./actionlint

      - name: Hadolint
        run: |
          curl -sSfL -o hadolint https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64
          chmod +x hadolint
          ./hadolint Dockerfile

      - name: Install changie
        uses: ./.github/actions/install-changie

      - name: Validate changie fragments
        shell: bash
        # changie next auto reads every fragment and fails on invalid YAML,
        # but errors when no fragments exist, so skip the empty state
        run: |
          shopt -s nullglob
          fragments=(.changes/unreleased/*.yaml)
          [ ${#fragments[@]} -eq 0 ] || changie next auto

      - name: Changelog
        uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        with:
          path: ./CHANGELOG.md
          validation_level: error
          validation_depth: 100

  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/se
          key: languagetool-${{ hashFiles('lib/simple_english/setup/languagetool.rb') }}

      - name: Set up LanguageTool
        run: bundle exec bin/se setup

      - name: Run the self-lint
        run: bundle exec rake lint

      - name: Run the rule examples
        run: bundle exec ruby test/examples_check.rb

  e2e:
    # The user story: build and install the gem, set up the
    # environment, lint files. Everything runs off the installed gem,
    # not the checkout's bundle. So the shipped package, the se
    # shim, and the daemon auto-boot are what gets tested.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"

      - name: Build and install the gem
        run: |
          gem build simple_english.gemspec
          gem install --no-document ./simple_english-*.gem

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/se
          # Shared with the rules job. Same distro pin, same download.
          key: languagetool-${{ hashFiles('lib/simple_english/setup/languagetool.rb') }}

      - name: Set up the environment
        run: se setup

      - name: Lint as a user
        run: bin/e2e-story
