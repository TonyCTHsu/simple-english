name: CI

on:
  push:
    branches: [master]
  pull_request:

# The toolchain facts the native cache keys on. A distribution or version
# change must invalidate the cached binary, so both live here, next to the
# cache key that consumes them. The community distribution pins an exact
# JDK build from the graalvm-ce-builds releases.
env:
  GRAALVM_DISTRIBUTION: graalvm-community
  GRAALVM_VERSION: "25.0.2"

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run the unit tests
        run: bundle exec rake test

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.standard-gems
          key: standardrb-1.56.0

      - name: StandardRB
        run: |
          if [ ! -x "$HOME/.standard-gems/bin/standardrb" ]; then
            gem install standard --no-document -v 1.56.0 --install-dir "$HOME/.standard-gems"
          fi
          PATH="$HOME/.standard-gems/bin:$PATH" GEM_PATH="$HOME/.standard-gems" standardrb

      - name: Actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7
          ./actionlint

      - name: Hadolint
        run: |
          curl -sSfL -o hadolint https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64
          chmod +x hadolint
          ./hadolint Dockerfile

      - name: Install changie
        uses: ./.github/actions/install-changie

      - name: Validate changie fragments
        shell: bash
        # changie next auto reads every fragment and fails on invalid YAML,
        # but errors when no fragments exist, so skip the empty state
        run: |
          shopt -s nullglob
          fragments=(.changes/unreleased/*.yaml)
          [ ${#fragments[@]} -eq 0 ] || changie next auto

      - name: Changelog
        uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        with:
          path: ./CHANGELOG.md
          validation_level: error
          validation_depth: 100

  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether the native job runs
        id: filter
        # Docs, tests, rules, agent integrations, and changelog text
        # never reach the binary, so a PR touching only those skips
        # the compile. Every other event builds.
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base"...HEAD \
            | grep -vE '^(\.changes/|docs/|integrations/|licenses/|rules/|test/|\.github/ISSUE_TEMPLATE/|THIRD_PARTY_NOTICES\.md|[^/]+\.md$)' \
            | grep -q .; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          distribution: ${{ env.GRAALVM_DISTRIBUTION }}
          version: ${{ env.GRAALVM_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Stage the JVM classpath
        run: bundle exec ruby -e 'require "./native/languagetool/build"; NativeLanguageToolBuild.prepare_classes'

      - name: Run the rules and daemon checks on the JVM
        env:
          SE_LANGUAGETOOL_EXECUTABLE: ${{ github.workspace }}/bin/dev-server
        run: |
          bundle exec rake test
          bundle exec ruby test/examples_check.rb
          PATH="$PWD/bin:$PATH" bundle exec bin/e2e-story

  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        # The same runners the release workflow builds on, so CI tests the
        # binary the release ships, floors included.
        runner: [ubuntu-22.04, ubuntu-22.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          distribution: ${{ env.GRAALVM_DISTRIBUTION }}
          version: ${{ env.GRAALVM_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Check native reachability metadata
        run: bundle exec ruby native/languagetool/metadata.rb --check

      - name: Restore the native build cache
        id: native_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/native-languagetool
          key: native-v2-${{ matrix.runner }}-${{ env.GRAALVM_DISTRIBUTION }}-${{ env.GRAALVM_VERSION }}-${{ hashFiles('native/languagetool/**', 'rules/simple-english.xml', 'Gemfile.lock') }}

      - name: Mark the cached executable as fresh
        if: steps.native_cache.outputs.cache-hit == 'true'
        run: touch tmp/native-languagetool/languagetool-native

      - name: Build, verify, and package the native server and gem
        run: bundle exec rake build
        env:
          NATIVE_IMAGE_PARALLELISM: "4"

      - name: Check the binary floors
        run: .github/scripts/check-floors.sh

      - name: Install the platform gem
        run: gem install --no-document ./dist/simple_english-*.gem

      - name: Verify the installed platform gem
        run: bin/e2e-story

      - name: Boot the installed daemon in an empty environment
        run: .github/scripts/daemon-empty-env.sh

      - name: Run the Ruby tests against the binary
        run: bundle exec rake test
