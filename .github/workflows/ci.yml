name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run the unit tests
        run: bundle exec rake test

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.standard-gems
          key: standardrb-1.56.0

      - name: StandardRB
        run: |
          if [ ! -x "$HOME/.standard-gems/bin/standardrb" ]; then
            gem install standard --no-document -v 1.56.0 --install-dir "$HOME/.standard-gems"
          fi
          PATH="$HOME/.standard-gems/bin:$PATH" GEM_PATH="$HOME/.standard-gems" standardrb

      - name: Actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7
          ./actionlint

      - name: Hadolint
        run: |
          curl -sSfL -o hadolint https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64
          chmod +x hadolint
          ./hadolint Dockerfile

      - name: Install changie
        uses: ./.github/actions/install-changie

      - name: Validate changie fragments
        shell: bash
        # changie next auto reads every fragment and fails on invalid YAML,
        # but errors when no fragments exist, so skip the empty state
        run: |
          shopt -s nullglob
          fragments=(.changes/unreleased/*.yaml)
          [ ${#fragments[@]} -eq 0 ] || changie next auto

      - name: Changelog
        uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        with:
          path: ./CHANGELOG.md
          validation_level: error
          validation_depth: 100

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          distribution: graalvm-community
          version: "25.0"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Check native reachability metadata
        run: bundle exec ruby native/languagetool/metadata.rb --check

      - name: Build native LanguageTool server
        run: bundle exec ruby native/languagetool/build.rb
        env:
          NATIVE_IMAGE_PARALLELISM: "4"

      - name: Verify native LanguageTool parity
        run: |
          bundle exec ruby native/languagetool/verify.rb \
            "$(cat tmp/native-languagetool/classpath)" \
            tmp/native-languagetool/languagetool-native

      - name: Build and install the platform gem
        run: |
          mkdir -p libexec/simple_english
          install -m 0755 tmp/native-languagetool/languagetool-native \
            libexec/simple_english/languagetool-server
          gem build simple_english.gemspec
          gem install --no-document ./simple_english-*-x86_64-linux.gem
        env:
          SIMPLE_ENGLISH_GEM_PLATFORM: x86_64-linux

      - name: Verify the installed platform gem
        run: bin/e2e-story

      - name: Boot the installed daemon in an empty environment
        run: .github/scripts/daemon-empty-env.sh

      - name: Run the Ruby and rules checks
        run: |
          bundle exec rake test
          bundle exec rake lint
          bundle exec ruby test/examples_check.rb
