# Temporary diagnostic for the opencode 2 e2e failure (PR #94).
# The 2.x server anchors on the checkout instead of the process cwd
# on the CI runner, but not on a mac with the same flags. Bisect the
# CI environment: each step strips one env slice and prints the
# directory the standalone server boots on. No model key needed:
# the boot line lands before the provider auth failure.
name: opencode-debug
on:
  workflow_dispatch:

jobs:
  anchor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install the agent
        run: npm install -g @opencode/cli@2.0.27

      - name: Baseline
        run: bin/debug-opencode-anchor baseline

      - name: No GITHUB_WORKSPACE
        run: bin/debug-opencode-anchor no-workspace GITHUB_WORKSPACE

      - name: No GITHUB_ vars
        run: |
          mapfile -t vars < <(env | grep -o '^GITHUB_[A-Z_]*')
          bin/debug-opencode-anchor no-github "${vars[@]}"

      - name: No CI vars
        run: |
          mapfile -t vars < <(env | grep -o '^RUNNER_[A-Z_]*')
          bin/debug-opencode-anchor no-ci CI "${vars[@]}"

      - name: No env at all
        run: env -i PATH="$PATH" HOME="$HOME" bin/debug-opencode-anchor no-env
