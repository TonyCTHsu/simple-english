name: Release prep

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override the computed version, like 1.0.0. Leave empty to let changie pick."
        required: false
        type: string

jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: "3.3"

      - name: Install changie
        uses: ./.github/actions/install-changie

      - name: Prepare the release
        env:
          VERSION: ${{ inputs.version }}
        run: rake "release:prepare[$VERSION]"

      - name: Read the release version
        id: version
        run: echo "version=$(ruby -Ilib -rsimple_english/version -e 'print SimpleEnglish::VERSION')" >> "$GITHUB_OUTPUT"

      - uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        with:
          path: ./CHANGELOG.md
          version: ${{ steps.version.outputs.version }}
          validation_level: error
          validation_depth: 100

      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: toby
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        id: cpr
        with:
          token: ${{ steps.toby.outputs.token }}
          branch: release/v${{ steps.version.outputs.version }}
          title: Release v${{ steps.version.outputs.version }}
          labels: release
          commit-message: Release v${{ steps.version.outputs.version }}
          # Every file release:prepare writes. It rewrites the README
          # action pins with the version, so README.md belongs here: left
          # out, the release branch ships stale pins and its CI fails.
          add-paths: |
            README.md
            .changes
            CHANGELOG.md
            Gemfile.lock
            lib/simple_english/version.rb
            integrations/claude-code/.claude-plugin/plugin.json
            integrations/codex/plugin.json
            integrations/cursor/plugin.json
            integrations/pi/package.json
          body-path: .changes/${{ steps.version.outputs.version }}.md
          sign-commits: true
