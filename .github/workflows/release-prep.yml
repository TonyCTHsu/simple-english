name: Release prep

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override the computed version, like 1.0.0. Leave empty to let changie pick."
        required: false
        type: string

jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"

      - name: Install changie
        uses: ./.github/actions/install-changie

      - name: Prepare the release
        env:
          VERSION: ${{ inputs.version }}
        run: rake "release:prepare[$VERSION]"

      - name: Read the release version
        id: version
        run: echo "version=$(ruby -Ilib -rsimple_english/version -e 'print SimpleEnglish::VERSION')" >> "$GITHUB_OUTPUT"

      - uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        with:
          path: ./CHANGELOG.md
          version: ${{ steps.version.outputs.version }}
          validation_level: error
          validation_depth: 100

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: toby
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: cpr
        with:
          token: ${{ steps.toby.outputs.token }}
          branch: release/v${{ steps.version.outputs.version }}
          title: Release v${{ steps.version.outputs.version }}
          labels: release
          commit-message: Release v${{ steps.version.outputs.version }}
          add-paths: |
            .changes
            CHANGELOG.md
            Gemfile.lock
            lib/simple_english/version.rb
            integrations/claude-code/.claude-plugin/plugin.json
            integrations/codex/.codex-plugin/plugin.json
            integrations/pi/package.json
          body-path: .changes/${{ steps.version.outputs.version }}.md
          sign-commits: true
