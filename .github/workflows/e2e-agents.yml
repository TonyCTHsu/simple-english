name: Agent e2e

# Layer 2 of the integrations test strategy: drive a live agent per
# harness through the lint scenario. Manual dispatch only, it spends
# tokens. The maintainer adds the secrets below in the repo settings.
#   ANTHROPIC_API_KEY: the Claude Code headless runs
#   OPENAI_API_KEY:    the Codex headless runs
#   GOOGLE_API_KEY:    the pi headless runs (default provider)
on:
  workflow_dispatch:
    inputs:
      run_claude:
        description: "Run the Claude Code scenario"
        type: boolean
        default: true
      run_pi:
        description: "Run the pi scenario"
        type: boolean
        default: true
      run_codex:
        description: "Run the Codex scenario"
        type: boolean
        default: true

jobs:
  claude:
    # Three agents with shell access and auto-approved edits run here on
    # provider keys. Read-only token: nothing they generate may push.
    permissions:
      contents: read
    if: inputs.run_claude
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"

      - name: Build and install the gem
        run: |
          gem build simple_english.gemspec
          gem install --no-document ./simple_english-*.gem

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/se
          key: languagetool-${{ hashFiles('lib/simple_english/setup/languagetool.rb') }}

      - name: Set up the environment
        run: se setup

      - name: Install the agent
        run: npm install -g @anthropic-ai/claude-code@2.1.288

      - name: Run the scenario
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SE_E2E_CLAUDE_MODEL: ${{ vars.E2E_CLAUDE_MODEL }}
        run: bin/e2e-agents claude

  pi:
    permissions:
      contents: read
    if: inputs.run_pi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"

      - name: Build and install the gem
        run: |
          gem build simple_english.gemspec
          gem install --no-document ./simple_english-*.gem

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/se
          key: languagetool-${{ hashFiles('lib/simple_english/setup/languagetool.rb') }}

      - name: Set up the environment
        run: se setup

      - name: Install the agent
        run: npm install -g @earendil-works/pi-coding-agent@1.0.1

      - name: Run the scenario
        env:
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SE_E2E_PI_MODEL: ${{ vars.E2E_PI_MODEL }}
        run: bin/e2e-agents pi

  codex:
    permissions:
      contents: read
    if: inputs.run_codex
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"

      - name: Build and install the gem
        run: |
          gem build simple_english.gemspec
          gem install --no-document ./simple_english-*.gem

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/se
          key: languagetool-${{ hashFiles('lib/simple_english/setup/languagetool.rb') }}

      - name: Set up the environment
        run: se setup

      - name: Install the agent
        run: npm install -g @openai/codex@0.160.0

      # ubuntu-24.04 restricts unprivileged user namespaces through
      # AppArmor, and bubblewrap's sandbox (used by codex --sandbox) needs
      # one. Lift the restriction or every command fails with
      # `bwrap: loopback: Failed RTM_NEWADDR`.
      - name: Let bubblewrap create its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run the scenario
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SE_E2E_CODEX_MODEL: ${{ vars.E2E_CODEX_MODEL }}
        run: bin/e2e-agents codex
