name: Other bug
description: The tool behaves in a wrong way, and the problem is not an install failure or a rule finding.
labels: ["bug"]
body:
  - type: textarea
    id: happened
    attributes:
      label: What did you do, and what happened?
      description: The command, the input, and the output. Include a snippet that reproduces the problem if you can.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, CPU architecture, Ruby version, and gem version. Leave empty if it does not matter.
    validations:
      required: false
