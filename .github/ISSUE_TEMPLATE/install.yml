name: Installation problem
description: The tool does not install or start.
labels: ["bug", "installation"]
body:
  - type: textarea
    id: tried
    attributes:
      label: What did you try?
      description: The install or lint command you ran.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What happened?
      description: Paste the full output or error message.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, CPU architecture, Ruby version, and how you installed the gem.
    validations:
      required: true
