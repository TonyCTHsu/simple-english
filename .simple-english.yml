# Self-lint config: `bin/se .` runs over the whole repo.
# The corpus before files and the rendered rule examples break the
# rules on purpose, and tmp/ holds generated build artifacts.
# vendor/ holds the bundled gems under CI's bundler-cache.
# .changes/ holds changie fragments that mirror the entries verbatim.
# The write skill embeds the swap vocabulary and worked examples,
# which break the rules on purpose, like docs/RULES.md.
# rules/simple-english.xml quotes rule-breaking tokens in its
# comments, like the corpus before files.
ignore:
  - test/corpus/**
  - docs/RULES.md
  - rules/simple-english.xml
  - integrations/shared/skills/write-simple-english/**
  - integrations/claude-code/skills/write-simple-english/**
  - integrations/codex/skills/write-simple-english/**
  - integrations/cursor/skills/write-simple-english/**
  - integrations/opencode/skills/write-simple-english/**
  - integrations/pi/skills/write-simple-english/**
  - integrations/vscode-copilot/skills/write-simple-english/**
  - tmp/**
  - vendor/**
  - .changes/**
  # Verbatim upstream license texts and notices. They cannot be
  # reworded, so self-lint skips them.
  - licenses/**
  - THIRD_PARTY_NOTICES.md
