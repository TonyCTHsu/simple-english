# Self-lint config: `bin/se .` runs over the whole repo.
# The corpus before files and the rendered rule examples break the
# rules on purpose, and tmp/ holds generated build artifacts.
# vendor/ holds the bundled gems under CI's bundler-cache.
# .changes/ holds changie fragments that mirror the entries verbatim.
ignore:
  - test/corpus/**
  - docs/RULES.md
  - tmp/**
  - vendor/**
  - .changes/**
  # Verbatim upstream license texts and notices; they cannot be
  # reworded, so self-lint skips them.
  - licenses/**
  - THIRD_PARTY_NOTICES.md
