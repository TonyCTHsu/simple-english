changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## [{{.Version}}] - {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: '- {{.Body}}'
kinds:
    - label: Breaking
      auto: major
    - label: Added
      auto: minor
    - label: Changed
      auto: minor
    - label: Fixed
      auto: patch
newlines:
    afterChangelogHeader: 1
    beforeChangelogVersion: 0
    afterVersion: 0
    beforeKind: 1
    afterKind: 1
    afterChangelogVersion: 1
    endOfVersion: 1
